name: iOS-ipa-build

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      # 1. Fix: Corrected the checkout action name
      - uses: actions/checkout@v4

      # 2. Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: 'stable'
          # Note: macos-latest is now often ARM64 (M1/M2). 
          # Removing architecture: x64 lets it pick the best native version.
          
      - run: flutter pub get

      # 3. Install Pods (Essential for Flutter iOS builds)
      - name: Install Pods
        run: |
          cd ios
          pod install
        
      # 4. Build the iOS app bundle
      - run: flutter build ios --release --no-codesign

      # 5. Package as IPA (Payload method)
      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          
      # 6. Upload to Release
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v1.01.3
          overwrite: true
          body: "Keyboard fix ?"
